# fnnas 下载器配置文件（ARM + x86）
# 生成后可自行修改再次运行。

# ARM 下载页面地址（用于解析 ARM 设备清单）
page_url = "https://fnnas.com/download-arm"

# x86 下载页面地址（用于解析 fnOS x86_64 安装 ISO）
# 设为空字符串或把 enable_x86 改为 false 可关闭 x86 抓取。
x86_page_url = "https://fnnas.com/download"

# 是否同时抓取并下载 x86 的 fnOS 安装 ISO
enable_x86 = true

# 所有镜像文件平铺存放到该目录
output_dir = "release"

# 同时下载的并发数
concurrency = 8

# 抓取页面 / 下载文件时使用的 User-Agent
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# 实际下载源。直链 https://iso.liveupdate.fnnas.com 在部分网络环境会被
# CDN 拦截(403)；迅雷镜像 http://thunder.liveupdate.fnnas.com:8080 路径
# 相同且支持 Range 断点续传。程序会把页面直链的 host 替换为此值。
# 留空则直接使用页面上的直链。
download_host = "http://thunder.liveupdate.fnnas.com:8080"

# 已存在且 MD5 校验通过的文件是否跳过下载
skip_verified = true

# 单个文件下载失败后的重试次数
retry = 10

# 下载完成后按此大小切分大文件，切成 -part01/-part02 ... 并删除原文件
# （规避 GitHub Releases 单文件 2GB 上传限制）。
#   - 0 或不写 = 不切分
#   - 支持 K/M/G/T 单位，如 1.8G、1800M；裸数字视为字节
# 也可用命令行 -split 1.8G 覆盖此值（CI 中即用命令行方式）。
# split_size = 0

# 开启下载的设备型号白名单。每条 pattern 做不区分大小写的子串匹配，
# 会对设备的 name / original_name / url 三个字段都尝试匹配。
#   - 留空（不写 [[devices]] 段）= 不下载任何设备
#   - 写一条 pattern = "*"        = 下载全部设备
#
# 示例：
# [[devices]]
# pattern = "nanopi-r5s"
#
# [[devices]]
# pattern = "rock-5b"
#
# [[devices]]
# pattern = "友善"

# --- 以下为本仓库(Rockchip)关注的开发板型号 ---
#[[devices]]
#pattern = "rock-5t"

#[[devices]]
#pattern = "nanopc-t6"

#[[devices]]
#pattern = "orangepi-5"

# --- x86_64 fnOS 安装 ISO（飞牛 fnOS x86_64）---
[[devices]]
pattern = "x86"

[[devices]]
pattern = "nanopc-t6"
